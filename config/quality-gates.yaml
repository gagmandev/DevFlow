# 质量门槛
# enforce 决定不满足时是 error（阻止状态变更）还是 warning（只提示）。

gates:
  node_accept:
    require_execution_report: true
    require_test_report: true
    require_tests_passed: true
    require_commands_executed: true
    require_acceptance_evidence: true
    # 有跳过用例就不能验收（跳过的测试等于没测）
    require_no_skipped: true
    # 改了 files_scope 之外的文件：error 阻止验收，warning 只提示
    out_of_scope: error

  # files_scope 为空时的策略：
  #   deny  严格模式，没有范围定义就拒绝验收
  #   warn  提示但放行（兼容旧计划）
  #   allow 视为不限制
  empty_scope: warn

  coverage:
    # 只有项目本身能统计覆盖率时才打开
    enabled: false
    target_line: 0.80
    enforce: false

  regression:
    require_build: true
    require_tests: true
    forbid_open_blockers: true
    forbid_missing_reports: true
    forbid_failed_tests: true
    # 需求没有被任何节点覆盖时直接判失败（不是警告）
    block_uncovered_requirements: true
    # 这些检查项必须存在且状态为 passed；不适用的项要标 skipped 并写原因
    required_checks:
      - build
      - unit_test
      - integration
      - core_flow
      - consistency
      - requirement_acceptance

  git:
    # off    不检查
    # warn   记录差异并提示，验收前人工看
    # error  有差异就阻止验收（需要 --ack-changes 记录豁免）
    verify_changes: warn

  release:
    require_regression_report: true
    # 交付报告必须区分"已验证/已实现未验证/未实现"
    require_status_split: true
